# Tests every pull request, and deploys to Fly.io on every push to main once the Rust tests pass.
# The deploy needs the FLY_API_TOKEN repo secret: a deploy token from `fly tokens create deploy -a webhawk`.
# Pull requests (forks' too) run only the tests, which never see the secret.
name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install 1.99.1 --profile minimal && cargo +1.99.1 test --workspace

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
