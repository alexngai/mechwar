# Deploys to Fly.io on every push to main, once the Rust tests pass.
# Needs the FLY_API_TOKEN repo secret: a deploy token from `fly tokens create deploy -a webhawk`.
name: Deploy
on:
  push:
    branches: [main]
concurrency: deploy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install 1.99.1 --profile minimal && cargo +1.99.1 test --workspace

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
