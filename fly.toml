# fly.toml app configuration file generated for webhawk on 2026-10-20T19:22:48-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

# Match state lives in memory: run exactly one machine (first deploy with --ha=false).
# It stops when idle and wakes on the next visit.
app = 'webhawk'
primary_region = 'iad'

[build]
[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 50

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
