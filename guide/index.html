<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guide · MECHWAR</title>
  <meta name="description" content="The MECHWAR field guide: the three mechs, every weapon, item and ability, the game modes and maps, and how it all plays.">
  <style>
    :root { color-scheme: dark; --bg: #0e1114; --panel: #171b20; --line: #ffffff17; --ink: #e8e4d8; --dim: #a3abb3; --amber: #ffc46a; --cyan: #7fe0ff; --blue: #4fb4ff; --red: #ff5a36; }
    html { background: var(--bg); scroll-padding-top: 72px; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.6 ui-monospace, Menlo, monospace; }
    a { color: var(--cyan); }
    header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 14px; padding: 10px 20px; background: #0a0d10f2; border-bottom: 1px solid var(--line); }
    header .logo { color: var(--amber); font-size: 18px; font-weight: bold; letter-spacing: 6px; text-decoration: none; }
    header .logo span { margin-left: 6px; color: var(--dim); font-size: 12px; font-weight: normal; letter-spacing: 3px; }
    header .play { margin-left: auto; padding: 6px 18px; border: 1px solid var(--cyan); color: var(--cyan); letter-spacing: 2px; text-decoration: none; }
    header .play:hover, header .play:focus-visible { background: #7fe0ff22; outline: none; }
    .wrap { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 36px; max-width: 1180px; margin: 0 auto; padding: 28px 20px 72px; }
    nav { position: sticky; top: 76px; align-self: start; display: flex; flex-direction: column; gap: 2px; }
    nav a { padding: 5px 10px; border-left: 2px solid transparent; color: var(--dim); letter-spacing: 2px; text-decoration: none; }
    nav a:hover { color: var(--ink); }
    nav a.on { border-color: var(--amber); color: var(--amber); }
    main { min-width: 0; }
    h1 { margin: 0 0 6px; color: var(--amber); font-size: 24px; letter-spacing: 6px; }
    h2 { margin: 36px 0 14px; padding-bottom: 6px; border-bottom: 1px solid var(--line); color: var(--amber); font-size: 14px; letter-spacing: 3px; }
    h2 small { margin-left: 10px; color: var(--dim); font-size: 11px; font-weight: normal; letter-spacing: 2px; }
    h3 { margin: 0; font-size: 14px; letter-spacing: 1px; }
    h4 { margin: 14px 0 6px; color: var(--dim); font-size: 11px; font-weight: normal; letter-spacing: 2px; }
    p, li { max-width: 78ch; }
    .lede { margin: 0 0 8px; color: var(--dim); font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
    .card { box-sizing: border-box; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); }
    .card.hit { border-color: var(--amber); }
    .card p { margin: 6px 0; }
    .card .head { display: flex; gap: 12px; align-items: center; }
    .card .head small { display: block; color: var(--dim); }
    .pic { flex: none; width: 112px; height: 56px; display: flex; align-items: center; justify-content: center; background: #0e1216; color: var(--cyan); font-size: 26px; }
    .pic img { width: 112px; height: 56px; }
    .tag { margin-left: 8px; color: var(--amber); font-size: 11px; font-weight: normal; letter-spacing: 1px; }
    .use { margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
    .use li { display: flex; gap: 10px; align-items: baseline; }
    .use kbd { flex: none; min-width: 34px; padding: 0 4px; border: 1px solid #7fe0ff88; color: var(--cyan); font: inherit; font-size: 10px; text-align: center; }
    .use kbd.blank { border-color: transparent; }
    .nums { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 12px 0 0; }
    .nums dt { color: var(--dim); font-size: 10px; letter-spacing: 1px; }
    .nums dd { margin: 0; }
    .fit { display: flex; gap: 6px; margin-top: 12px; }
    .fit span { flex: 1; padding: 3px 6px; border: 1px solid var(--line); color: var(--dim); font-size: 10px; letter-spacing: 1px; }
    .fit b { display: block; color: var(--ink); font-size: 12px; font-weight: normal; letter-spacing: 0; }
    .fit .own b { color: var(--cyan); }
    .fit .no b { color: #ffffff40; }
    .links { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .links a { display: block; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); text-decoration: none; }
    .links a:hover { border-color: var(--cyan); }
    .links b { display: block; color: var(--cyan); letter-spacing: 2px; }
    .links small { color: var(--dim); }
    ol.steps { padding-left: 22px; }
    ol.steps li { margin-bottom: 8px; }
    .mech { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 20px; margin-bottom: 14px; }
    .mech canvas { width: 260px; height: 320px; background: #0e1216; cursor: grab; touch-action: pan-y; }
    .mech h2 { margin-top: 0; }
    .bars { display: grid; grid-template-columns: 120px minmax(0, 1fr) 70px; gap: 4px 12px; align-items: center; max-width: 520px; }
    .bars .bar { height: 6px; background: #ffffff14; }
    .bars .bar i { display: block; height: 100%; background: var(--cyan); }
    .bars span:nth-child(3n) { text-align: right; white-space: nowrap; }
    .kit { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 14px; margin: 0; }
    .kit dt { color: var(--dim); font-size: 11px; letter-spacing: 1px; }
    .kit dd { margin: 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chips a, .chips span { padding: 1px 8px; border: 1px solid var(--line); color: var(--ink); font-size: 11px; letter-spacing: 1px; text-decoration: none; }
    .chips a:hover { border-color: var(--cyan); }
    .shot, .plan { position: relative; aspect-ratio: 16 / 9; background: #0b0e11; }
    .card .shot { margin: -12px -14px 10px; }
    .plan { aspect-ratio: 1; }
    .shot img, .plan img, .plan svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .wait { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #ffffff40; letter-spacing: 2px; }
    a.card { display: block; color: inherit; text-decoration: none; }
    a.card:hover { border-color: var(--cyan); }
    a.card .chips span { border-color: var(--line); }
    .shot.wide { margin: 12px 0; }
    .crumbs { margin: 0 0 4px; color: var(--dim); letter-spacing: 2px; }
    .crumbs a { text-decoration: none; }
    .layout { display: grid; grid-template-columns: minmax(0, 620px) minmax(0, 1fr); gap: 20px; align-items: start; }
    .layout .key { flex-direction: column; gap: 6px; font-size: 12px; }
    .spots { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
    .spots figure { margin: 0; }
    .pager { display: flex; justify-content: space-between; margin-top: 32px; letter-spacing: 1px; }
    .plan text { font-family: ui-monospace, Menlo, monospace; font-weight: bold; text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: #000c; }
    .key { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--dim); font-size: 11px; }
    .key i { font-style: normal; font-weight: bold; }
    table { border-collapse: collapse; }
    td, th { padding: 4px 14px 4px 0; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: var(--dim); font-size: 11px; font-weight: normal; letter-spacing: 1px; }
    .rules li { margin-bottom: 4px; }
    /* The controls card, as the game's Esc menu draws it (web/controls.js). */
    #controls { padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); }
    .controls-map { display: flex; gap: 28px; justify-content: center; align-items: center; flex-wrap: wrap; }
    .keyboard { display: flex; flex-direction: column; gap: 4px; }
    .krow { display: flex; gap: 4px; }
    .cap { box-sizing: border-box; height: 24px; display: flex; align-items: center; justify-content: center; border: 1px solid #ffffff1c; color: #ffffff38; font-size: 10px; }
    .cap.used { font-weight: bold; }
    .mouse .mb { font-size: 10px; fill: #e8e4d8; text-anchor: middle; }
    .legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 8px 24px; margin-top: 12px; }
    .cgroup { display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; align-content: start; font-size: 11px; line-height: 1.4; }
    .cgroup h4 { grid-column: 1 / -1; margin: 0; font-size: 11px; font-weight: bold; letter-spacing: 2px; }
    .bind { display: contents; }
    .bind .keys { display: flex; gap: 2px; align-items: flex-start; }
    .bind kbd { min-width: 18px; padding: 0 4px; border: 1px solid var(--c); color: var(--c); font: inherit; font-size: 10px; text-align: center; }
    .bind i { font-style: normal; opacity: 0.6; }
    @media (max-width: 780px) {
      .wrap { grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 12px 16px 56px; }
      nav { position: static; flex-direction: row; overflow-x: auto; border-bottom: 1px solid var(--line); }
      nav a { border-left: 0; border-bottom: 2px solid transparent; white-space: nowrap; }
      .grid { grid-template-columns: minmax(0, 1fr); }
      .mech { grid-template-columns: minmax(0, 1fr); }
      .mech canvas { width: 100%; height: 280px; }
      .bars { grid-template-columns: 112px minmax(0, 1fr) max-content; }
      .keyboard { display: none; }
      .layout, .spots { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <header><a class="logo" href="/guide/">MECHWAR<span>GUIDE</span></a><a class="play" href="/">PLAY</a></header>
  <div class="wrap">
    <nav id="nav" aria-label="Guide sections"></nav>
    <main id="page"></main>
  </div>
  <script type="module" src="/web/guide.js"></script>
</body>
</html>
