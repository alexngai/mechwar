<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mech Sandbox</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1c2026; font: 12px/1.4 ui-monospace, Menlo, monospace; color: #e8e4d8; }
    canvas { display: block; }
    #hud { position: fixed; left: 16px; top: 16px; pointer-events: none; }
    #glass { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #glass.glow { filter: drop-shadow(0 0 2px rgba(255, 170, 80, 0.7)); }
    .card p { margin: 10px 0 0; opacity: 0.85; }
    .card p b { font-size: 12px; margin-bottom: 2px; }
    #score { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); padding: 4px 12px; background: #0009; font-size: 14px; white-space: pre; pointer-events: none; }
    #banner { position: fixed; top: 30%; left: 0; right: 0; text-align: center; font-size: 28px; letter-spacing: 2px; text-shadow: 0 2px 6px #000; pointer-events: none; }
    #score:empty, #banner:empty { display: none; }
    #picker { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; background: #0a0d10d0; }
    #picker[hidden] { display: none; }
    #picker h2 { margin: 0; font-size: 18px; letter-spacing: 2px; }
    #cards { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    .card { width: 180px; padding: 14px; border: 1px solid #fff3; background: #1c2026; color: inherit; font: inherit; text-align: left; cursor: pointer; }
    .card:hover, .card:focus-visible { border-color: #7fe0ff; outline: none; }
    .card b { display: block; margin-bottom: 4px; font-size: 16px; }
    .card .key { float: right; opacity: 0.6; }
    .card dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 10px 0 0; }
    .card dd { margin: 0; text-align: right; }
    #stats { position: fixed; right: 16px; bottom: 16px; padding: 4px 8px; background: #0009; pointer-events: none; }
    #damage { position: fixed; inset: 0; box-shadow: inset 0 0 140px 30px #ff2a1a; opacity: 0; pointer-events: none; }
    #callsign-row { display: flex; gap: 10px; align-items: center; letter-spacing: 2px; opacity: 0.9; }
    #callsign { font: inherit; font-size: 14px; letter-spacing: 1px; padding: 6px 8px; width: 180px; background: #0d1014; color: #ffc46a; border: 1px solid #fff3; }
    #callsign:focus { border-color: #ffc46a; outline: none; }
    #board { position: fixed; top: 14%; left: 50%; transform: translateX(-50%); padding: 12px 16px; background: #0a0d10e0; border: 1px solid #ffc46a55; color: #ffc46a; pointer-events: none; }
    #board[hidden] { display: none; }
    #board .head { text-align: center; font-size: 15px; letter-spacing: 2px; margin-bottom: 8px; }
    #board .teams { display: flex; gap: 24px; }
    #board table { border-collapse: collapse; min-width: 260px; }
    #board th, #board td { padding: 2px 8px; text-align: left; }
    #board td:nth-child(n+3), #board th:nth-child(n+3) { text-align: right; }
    #board .t0 th:first-child { color: #4fb4ff; }
    #board .t1 th:first-child { color: #ff5a36; }
    #board tr.me td { background: #ffc46a22; color: #fff; }
    #board i { font-style: normal; font-size: 10px; opacity: 0.6; }
    #help { position: fixed; left: 16px; top: 40px; padding: 6px 10px; background: #0009; pointer-events: none; max-width: calc(100vw - 300px); }
    body.locked #help { display: none; }
  </style>
</head>
<body>
  <div id="hud"><div id="net"></div></div>
  <div id="damage"></div>
  <canvas id="glass"></canvas>
  <div id="stats" hidden></div>
  <div id="score"></div>
  <div id="board" hidden></div>
  <div id="banner"></div>
  <div id="picker">
    <label id="callsign-row">CALLSIGN <input id="callsign" maxlength="16" autocomplete="off" spellcheck="false" placeholder="Pilot"></label>
    <h2>CHOOSE YOUR MECH</h2>
    <div id="cards"></div>
    <div id="picker-note"></div>
  </div>
  <div id="help">Click to play · WASD move · Shift+W boost · Shift+A/D dash · Shift+S turn about · Space hover · F ability · G grenade · T EMP · LMB fire · RMB secondary · V camera · C change mech · I stats · Tab scores · R hold to repair · K respawn · Esc release mouse</div>
  <script type="module" src="/web/main.js"></script>
</body>
</html>
