<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mech Sandbox</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1c2026; font: 12px/1.4 ui-monospace, Menlo, monospace; color: #e8e4d8; }
    canvas { display: block; }
    #hud { position: fixed; left: 16px; bottom: 16px; width: 240px; pointer-events: none; }
    .bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .bar span { width: 44px; }
    .bar div { flex: 1; height: 10px; overflow: hidden; background: #0008; border: 1px solid #fff4; }
    .bar i { display: block; height: 100%; width: 0; }
    #fuel { background: #5fc4e8; }
    #heat { background: #f0a040; }
    #heat.over { background: #ff3b30; }
    #dodge { background: #b8e070; }
    #hp { background: #e8665f; }
    #ability { background: #b9a2e8; }
    #ability.active { background: #7fe0ff; }
    .bar span.wide { width: auto; min-width: 44px; }
    .card p { margin: 10px 0 0; opacity: 0.85; }
    .card p b { font-size: 12px; margin-bottom: 2px; }
    #crosshair.hit { border-color: #ff3b30; }
    #score { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); padding: 4px 12px; background: #0009; font-size: 14px; white-space: pre; pointer-events: none; }
    #banner { position: fixed; top: 30%; left: 0; right: 0; text-align: center; font-size: 28px; letter-spacing: 2px; text-shadow: 0 2px 6px #000; pointer-events: none; }
    #score:empty, #banner:empty { display: none; }
    #picker { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; background: #0a0d10d0; }
    #picker[hidden] { display: none; }
    #picker h2 { margin: 0; font-size: 18px; letter-spacing: 2px; }
    #cards { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    .card { width: 180px; padding: 14px; border: 1px solid #fff3; background: #1c2026; color: inherit; font: inherit; text-align: left; cursor: pointer; }
    .card:hover, .card:focus-visible { border-color: #7fe0ff; outline: none; }
    .card b { display: block; margin-bottom: 4px; font-size: 16px; }
    .card .key { float: right; opacity: 0.6; }
    .card dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 10px 0 0; }
    .card dd { margin: 0; text-align: right; }
    #stats { position: fixed; right: 16px; bottom: 16px; padding: 4px 8px; background: #0009; pointer-events: none; }
    #damage { position: fixed; inset: 0; box-shadow: inset 0 0 140px 30px #ff2a1a; opacity: 0; pointer-events: none; }
    #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -4px 0 0 -4px; border: 1px solid #fff; border-radius: 50%; pointer-events: none; }
    #help { position: fixed; left: 16px; top: 16px; padding: 6px 10px; background: #0009; pointer-events: none; max-width: calc(100vw - 300px); }
    body.locked #help { display: none; }
  </style>
</head>
<body>
  <div id="hud">
    <div id="net"></div>
    <div id="status"></div>
    <div class="bar"><span>HP</span><div><i id="hp"></i></div></div>
    <div class="bar"><span>FUEL</span><div><i id="fuel"></i></div></div>
    <div class="bar"><span>HEAT</span><div><i id="heat"></i></div></div>
    <div class="bar"><span>DODGE</span><div><i id="dodge"></i></div></div>
    <div class="bar"><span id="ability-name" class="wide">ABILITY</span><div><i id="ability"></i></div></div>
  </div>
  <div id="damage"></div>
  <div id="stats" hidden></div>
  <div id="crosshair"></div>
  <div id="score"></div>
  <div id="banner"></div>
  <div id="picker">
    <h2>CHOOSE YOUR MECH</h2>
    <div id="cards"></div>
    <div id="picker-note"></div>
  </div>
  <div id="help">Click to play · WASD move · Shift boost · Space hover · Q/E dodge · F ability · LMB fire · V camera · C change mech · I stats · R respawn · Esc release mouse</div>
  <script type="module" src="/web/main.js"></script>
</body>
</html>
